name: Check Install Environments

on:
  push:
    paths:
      - "pixi.toml"
      - "pixi.lock"
      - "scripts/install_packages.R"
      - "scripts/post_install.sh"
      - ".github/workflows/check-envs.yml"
  pull_request:
    paths:
      - "pixi.toml"
      - "pixi.lock"
      - "scripts/install_packages.R"
      - "scripts/post_install.sh"
      - ".github/workflows/check-envs.yml"
  workflow_dispatch:

jobs:
  # -------------------------------------------------------------------
  # Arm 1: Vanilla R (install_packages.R — what RStudio beginners run)
  # -------------------------------------------------------------------
  vanilla-r:
    name: "Vanilla R (${{ matrix.os }})"
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - name: Install system dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libcurl4-openssl-dev libssl-dev libxml2-dev \
            libfontconfig1-dev libharfbuzz-dev libfribidi-dev \
            libfreetype6-dev libpng-dev libtiff5-dev libjpeg-dev \
            libgit2-dev cmake

      - name: Install R packages
        run: Rscript scripts/install_packages.R

      - name: Verify key packages load
        run: |
          Rscript -e '
            pkgs <- c("tidyverse", "rms", "glmnet", "survival", "brms", "ranger", "xgboost", "mice")
            for (p in pkgs) {
              library(p, character.only = TRUE)
              cat(p, ": OK\n")
            }
          '

  # -------------------------------------------------------------------
  # Arm 2: Pixi R environment (full = default Python + R feature)
  # -------------------------------------------------------------------
  pixi-r:
    name: "Pixi R (${{ matrix.os }})"
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: prefix-dev/setup-pixi@v0.8.8
        with:
          environments: full

      - name: Run post_install (CRAN packages)
        shell: bash
        run: pixi run -e full post_install

      - name: Verify R packages load
        run: |
          pixi run -e full Rscript -e '
            pkgs <- c("tidyverse", "rms", "glmnet", "survival", "brms", "ranger", "xgboost", "mice")
            for (p in pkgs) {
              library(p, character.only = TRUE)
              cat(p, ": OK\n")
            }
          '

  # -------------------------------------------------------------------
  # Arm 3: Pixi Python environment (default env)
  # -------------------------------------------------------------------
  pixi-python:
    name: "Pixi Python (${{ matrix.os }})"
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: prefix-dev/setup-pixi@v0.8.8

      - name: Verify Python packages import
        run: |
          pixi run python -c "
          import numpy
          print('Python env OK.')
          "
