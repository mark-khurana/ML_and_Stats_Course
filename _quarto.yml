project:
  type: book
  output-dir: _book

# Make the website citeable and indexable by Google Scholar.
# google-scholar emits citation_* meta tags; the citation block renders a
# "Citation" box (with copyable BibTeX) at the bottom of every page.
google-scholar: true
citation:
  type: webpage
  title: "Advanced Statistics and Machine Learning for Health Research"
  author:
    - Mark Khurana
    - Neil Scheidwasser
  issued: 2026
  url: https://mlhealthcourse.github.io/
  # doi: 10.5281/zenodo.XXXXXXX   # add once a DOI is minted via Zenodo (see below)

book:
  title: "Advanced Statistics and Machine Learning for Health Research"
  subtitle: "A Practical Course for Health Researchers"
  author:
    - "Mark Khurana"
    - "Neil Scheidwasser"
  date: last-modified
  date-format: "MMMM D, YYYY"
  repo-url: https://github.com/mlhealthcourse/mlhealthcourse.github.io
  repo-actions: [edit, issue, source]
  repo-branch: main
  search: true
  sharing: [twitter, linkedin]
  reader-mode: true
  page-navigation: true
  page-footer:
    center: |
      **Cite this website as:** Khurana M & Scheidwasser N (2026). *Advanced Statistics and Machine Learning for Health Research.* <https://mlhealthcourse.github.io/>

      Spotted an error or have an idea? [Suggest an improvement](/index.html#sec-feedback) --- we read everything.
  sidebar:
    collapse-level: 1
    style: floating
    logo: assets/hex-logo.png
  open-graph:
    image: assets/social-preview.png
  twitter-card:
    image: assets/social-preview.png

  chapters:
    - index.qmd

    - part: "Pre-Course: Foundations"
      chapters:
        - chapters/setup.qmd
        - chapters/probability_and_distributions.qmd
        - chapters/inference_and_estimation.qmd
        - chapters/regression_foundations.qmd

    - part: "Advanced Statistical Methods"
      chapters:
        - chapters/continuous_variables_and_splines.qmd
        - chapters/penalized_regression.qmd
        - chapters/survival_analysis.qmd
        - chapters/mixed_models.qmd
        - chapters/missing_data.qmd

    - part: "Bayesian Methods"
      chapters:
        - chapters/bayesian_inference.qmd
        - chapters/applied_bayesian_modeling.qmd

    - part: "Supervised Learning"
      chapters:
        - chapters/ml_foundations.qmd
        - chapters/trees_and_ensembles.qmd
        - chapters/introduction_to_deep_learning.qmd
        - chapters/model_evaluation.qmd
        - chapters/ml_explainability.qmd

    - part: "Applied Supervised Learning: Clinical Prediction Models"
      chapters:
        - chapters/building_prediction_models.qmd
        - chapters/performance_and_validation.qmd
        - chapters/reporting_and_implementation.qmd

    - part: "Unsupervised Learning"
      chapters:
        - chapters/dimensionality_reduction.qmd
        - chapters/clustering.qmd

    - part: "Advanced Research Toolkit"
      chapters:
        - advanced/causal_inference.qmd
        - advanced/mediation.qmd
        - advanced/meta_analysis.qmd

  appendices:
    - appendices/A_dataset_codebook.qmd
    - appendices/B_math_notation.qmd
    - appendices/C_further_reading.qmd
    - appendices/D_exercise_solutions.qmd

format:
  html:
    theme:
      light: [cosmo, custom.scss]
    code-tools: true
    code-copy: true
    code-fold: true
    code-overflow: wrap
    code-line-numbers: true
    toc: true
    toc-depth: 3
    number-sections: true
    number-depth: 3
    fig-responsive: true
    linestretch: 1.6
    smooth-scroll: true
    filters:
      - _extensions/pandoc-ext/section-bibliographies/section-bibliographies.lua
      - _filters/bib-notes.lua
    include-after-body:
      - _includes/citation.html
      - _includes/goatcounter.html

execute:
  eval: false
  freeze: auto
  warning: false
  message: false

bibliography: references.bib
citeproc: false

knitr:
  opts_chunk:
    fig.width: 8
    fig.height: 5
    fig.align: center
    out.width: "100%"
    # Hold each chunk's text output until after its (single) source block so
    # code-fold produces ONE "Code" dropdown per chunk instead of one per
    # output-producing line. Avoids the fragmented "Code / stray text" look.
    results: hold
