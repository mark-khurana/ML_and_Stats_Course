[workspace]
# Deliberately no "Name <email>" here: this file is public, and a plaintext
# address in a repository is the easiest thing there is for a harvester to find.
# Reader contact goes through the obfuscated address on the site's welcome page
# (see the "Suggest an improvement" section in index.qmd).
authors = [
    "Neil Scheidwasser",
    "Mark Khurana",
]
channels = ["conda-forge"]
name = "mlstatscourse"
platforms = ["linux-64", "osx-arm64", "win-64"]
version = "0.1.0"

# ---------------------------------------------------------------------------
# Tasks
# ---------------------------------------------------------------------------
[tasks]
post_install = "bash scripts/post_install.sh"
check_install = "python scripts/check_packages.py"

[feature.book.tasks]
easy_preview = "quarto preview"
easy_render = "quarto render"

# ---------------------------------------------------------------------------
# Default: Python chapter dependencies (tier 2 — Python + VS Code students)
# ---------------------------------------------------------------------------
[dependencies]
python = ">=3.13.5,<3.14"
umap-learn = ">=0.5.12,<0.6"
ipykernel = ">=7.3.0,<8"

[pypi-dependencies]
numpy = ">=2.4.6,<3"
pandas = ">=3.0.3,<4"
scikit-learn = ">=1.9.0,<2"
scipy = ">=1.18.0,<2"
matplotlib = ">=3.11.0,<4"
dowhy = ">=0.14,<0.15"
statsmodels = ">=0.14.6,<0.15"
patsy = ">=1.0.2,<2"
lifelines = ">=0.30.0,<0.31"
xgboost = ">=3.3.0,<4"
shap = ">=0.49.1, <0.53"
seaborn = ">=0.13.2, <0.14"
networkx = ">=3.6.1, <4"
bambi = ">=0.18.0, <0.19"
arviz = ">=1.2.0, <2"
pymc = ">=6.0.1, <7"
keras = ">=3.15.0, <4"
miceforest = ">=6.0.5, <7"
tensorflow = ">=2.21.0, <3"

# ---------------------------------------------------------------------------
# Feature: r — all R chapter dependencies
# ---------------------------------------------------------------------------
[feature.r.dependencies]
r-base = ">=4.5.3,<4.6"
r-tidyverse = ">=2.0.0,<3"
r-remotes = ">=2.5.0,<3"
r-rms = ">=8.1_1,<9"
r-tidymodels = ">=1.4.1,<2"
r-glmnet = ">=5.0,<6"
r-survminer = ">=0.5.2,<0.6"
r-tidycmprsk = ">=1.1.2,<2"
r-mlbench = ">=2.1_8,<3"
r-kernlab = ">=0.9_33,<0.10"
"r-rpart.plot" = ">=3.1.4,<4"
r-prroc = ">=1.4,<2"
r-rtsne = ">=0.17,<0.18"
r-uwot = ">=0.2.4,<0.3"
r-dbscan = ">=1.2.2,<2"
r-mclust = ">=6.1.2,<7"
r-matchit = ">=4.7.2,<5"
r-cobalt = ">=4.6.3,<5"
r-weightit = ">=1.7.0,<2"
r-meta = ">=8.5_0,<9"
r-metafor = ">=5.0_1,<6"
r-netmeta = ">=3.6_0,<4"
r-marginaleffects = ">=0.32.0,<0.33"
r-ranger = ">=0.18.0,<0.19"
r-xgboost = ">=3.2.0,<4"
r-shapviz = ">=0.10.3,<0.11"
r-pdp = ">=0.8.3,<0.9"
r-pmsampsize = ">=1.1.3,<2"
r-mice = ">=3.19.0,<4"
r-rcppparallel = ">=5.1.11,<6"

# ---------------------------------------------------------------------------
# Feature: book — lightweight rendering (quarto + knitr, no chapter packages)
# ---------------------------------------------------------------------------
[feature.book.dependencies]
quarto = ">=1.9.38,<2"
r-rmarkdown = ">=2.31,<3"
r-knitr = ">=1.51,<2"
r-reticulate = ">=1.46.0,<2"

[feature.book.activation]
env = { QUARTO_R = "$PIXI_PROJECT_ROOT/.pixi/envs/book/bin/R" }

# ---------------------------------------------------------------------------
# Feature: dev — book rendering tools (quarto + knitr engine)
# ---------------------------------------------------------------------------
[feature.dev.dependencies]
quarto = ">=1.9.38,<2"
r-rmarkdown = ">=2.31,<3"
r-knitr = ">=1.51,<2"
r-reticulate = ">=1.46.0,<2"
codespell = ">=2.4.1,<3"
pre-commit = ">=4.2.0,<5"

[feature.dev.tasks]
preview = "quarto preview"
render = "quarto render"

[feature.dev.activation]
env = { QUARTO_R = "$PIXI_PROJECT_ROOT/.pixi/envs/dev/bin/R", RETICULATE_PYTHON = "$PIXI_PROJECT_ROOT/.pixi/envs/dev/bin/python" }

# ---------------------------------------------------------------------------
# Environments
# ---------------------------------------------------------------------------
[environments]
# Python students: pixi install
default = { solve-group = "default" }
# Python + R students: pixi install -e full && pixi run -e full post_install
full = { features = ["r"], solve-group = "full" }
# Render book from _freeze (CI + local): pixi run render
book = { features = ["book"], solve-group = "book" }
# Contributors: pixi install -e dev && pixi run -e dev post_install
dev = { features = ["r", "dev"], solve-group = "dev" }
